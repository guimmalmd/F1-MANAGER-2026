<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">F1 Manager 2026</title>
  <desc id="desc">Banner temático de automobilismo para o projeto F1 Manager 2026</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060606"/>
      <stop offset="0.55" stop-color="#111111"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a0000"/>
      <stop offset="0.45" stop-color="#e10600"/>
      <stop offset="1" stop-color="#ff3b30"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="34" fill="url(#grid)"/>

  <!-- speed streaks -->
  <g opacity="0.9">
    <path d="M0 98 H480" stroke="#e10600" stroke-width="8"/>
    <path d="M0 122 H360" stroke="#e10600" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M1160 418 H1600" stroke="#e10600" stroke-width="8"/>
    <path d="M1240 394 H1600" stroke="#e10600" stroke-opacity="0.55" stroke-width="3"/>
  </g>

  <!-- abstract track -->
  <path id="track" d="M1120 112 C1330 52 1495 130 1460 252 C1432 350 1270 336 1242 250 C1210 152 1377 155 1388 242 C1397 316 1268 405 1090 374" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="18" stroke-linecap="round"/>
  <path d="M1120 112 C1330 52 1495 130 1460 252 C1432 350 1270 336 1242 250 C1210 152 1377 155 1388 242 C1397 316 1268 405 1090 374" fill="none" stroke="#e10600" stroke-width="3" stroke-dasharray="18 20" stroke-linecap="round" opacity="0.95">
    <animate attributeName="stroke-dashoffset" from="0" to="-76" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <circle r="10" fill="#ff3028" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#track"/>
    </animateMotion>
  </circle>

  <!-- small F1-inspired mark -->
  <g transform="translate(110 115)">
    <path d="M0 0 H150 L115 34 H0 Z" fill="#e10600"/>
    <path d="M32 48 H180 L145 82 H32 Z" fill="#e10600" opacity="0.7"/>
    <text x="0" y="142" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900" letter-spacing="-3">F1</text>
    <text x="112" y="142" fill="#e10600" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" letter-spacing="5">MANAGER</text>
  </g>

  <text x="110" y="318" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="900" letter-spacing="1">F1 MANAGER 2026</text>
  <text x="114" y="372" fill="#c8c8c8" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" letter-spacing="2">POO • JDBC • ORACLE • SPRING BOOT • REST • FRONT-END</text>

  <rect x="112" y="420" width="730" height="3" rx="2" fill="url(#red)"/>
  <text x="114" y="464" fill="#8f8f8f" font-family="monospace" font-size="20">LEARN THE STACK. BUILD THE SYSTEM. UNDERSTAND THE FLOW.</text>

  <rect x="0" y="0" width="1600" height="8" rx="4" fill="url(#red)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.8s" repeatCount="indefinite"/>
  </rect>
</svg>
